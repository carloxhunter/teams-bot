# Checks for every PR (required to merge into main) and for every commit that lands on main.
# Actions are pinned to a commit SHA (with the version in a comment): a moved tag can't change what
# runs here. Dependabot keeps the SHAs up to date.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # On PRs the previous run is cancelled; on main every run completes.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Each check is an independent status check (and required to merge into main).
  check:
    name: ${{ matrix.check.name }}
    runs-on: ubuntu-latest
    strategy:
      # If one fails, the others keep going to show every problem at once.
      fail-fast: false
      matrix:
        check:
          - { name: Lint, run: pnpm lint }
          - { name: Tests, run: pnpm test }
          # Known vulnerabilities in production dependencies (Dependabot alerts too, but this blocks).
          - { name: 'Dependencies (audit)', run: pnpm audit --prod --audit-level=high }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: ${{ matrix.check.run }}

  secret-scan:
    name: Secretos (gitleaks)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
